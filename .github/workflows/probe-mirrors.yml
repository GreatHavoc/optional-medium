name: Probe mirrors

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe mirrors
        run: python scripts/probe_mirrors.py
      - name: Commit health file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirrors.json
          if ! git diff --cached --quiet; then
            git commit -m "Update mirror health"
            git push
          fi
